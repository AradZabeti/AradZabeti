name: Accessibility UI loader

on:
  push:
    branches: [main]
    paths:
      - accessibility.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inject accessibility runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="accessibility.js"></script>'
          if tag not in text:
              marker = '<script src="performance.js"></script>'
              if marker in text:
                  text = text.replace(marker, marker + tag, 1)
              elif '</body>' in text:
                  text = text.replace('</body>', tag + '</body>', 1)
              else:
                  text += tag
              p.write_text(text, encoding='utf-8')

      - name: Commit injected loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: load accessibility runtime"
          git push

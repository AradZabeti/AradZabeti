name: Load Activity UI

on:
  push:
    branches: [main]
    paths:
      - 'activity.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inject Activity script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="activity.js"></script>'
          if tag not in s:
              marker='<script src="app.js"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag)
              else:
                  s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: load activity live UI'
          git push

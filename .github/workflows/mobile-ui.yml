name: Load mobile optimization

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inject mobile stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="mobile.css">'
          if marker not in s:
              s = s.replace('</head>', marker + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injected stylesheet
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "chore: load mobile optimization stylesheet"
          git push

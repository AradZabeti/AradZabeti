name: Optimize portfolio loading

on:
  push:
    branches: [main]
    paths:
      - 'performance.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add deferred performance loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ARAD_PERFORMANCE -->'
          if marker not in s:
              block='''<!-- ARAD_PERFORMANCE -->
          <script src="performance.js" defer></script>'''
              s=s.replace('</head>',block+'\n</head>',1)
          for src in ('app.js','activity.js','pwa.js'):
              s=s.replace(f'<script src="{src}"></script>',f'<script src="{src}" defer></script>')
          p.write_text(s,encoding='utf-8')

      - name: Commit optimized loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "perf: defer non-blocking portfolio scripts"; git push; fi

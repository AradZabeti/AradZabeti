name: Portfolio integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pages:
    name: Validate site and profile assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exported site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PHP CLI and bridge syntax
        run: php -v && php -l cpanel/terminal.php
      - name: Run validator and security regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check internal HTML links and local assets
        run: python scripts/check_site_links.py
      - name: Verify GitHub profile links and SVG artwork
        run: python scripts/check_profile_readme.py

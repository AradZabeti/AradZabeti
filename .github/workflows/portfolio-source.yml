name: Portfolio source verification

on:
  push:
    branches: [main]
    paths:
      - "universe-source/**"
      - ".github/workflows/portfolio-source.yml"
  pull_request:
    paths:
      - "universe-source/**"
      - ".github/workflows/portfolio-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Build and validate Next.js export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: universe-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: universe-source/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build static GitHub Pages export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /AradZabeti
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify exported links and anchors
        run: npm run verify:export
      - name: Upload reviewable static preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digital-universe-phase3-preview
          path: universe-source/out/
          if-no-files-found: error
          retention-days: 7

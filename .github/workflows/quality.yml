name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html resume.html README.md 404.html robots.txt sitemap.xml SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "$file"
          done

      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml: valid XML')"

      - name: Validate HTML structure
        run: |
          set -euo pipefail
          for file in index.html resume.html 404.html; do
            grep -qi '<!doctype html>' "$file"
            grep -qi '<html' "$file"
            grep -qi '<head' "$file"
            grep -qi '</head>' "$file"
            grep -qi '<body' "$file"
            grep -qi '</body>' "$file"
            grep -qi '</html>' "$file"
            echo "$file: basic structure OK"
          done

      - name: Check obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|github_pat_[0-9A-Za-z_]{20,}|xoxb-[0-9-]{20,}' . --exclude-dir=.git --exclude='*.map'; then
            echo 'Potential secret pattern detected.'
            exit 1
          fi
          echo 'No obvious secret patterns detected.'

      - name: Check local asset references
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/profile-hero.svg
          test -f assets/system-map.svg
          test -f assets/neon-divider.svg
          echo 'Local visual assets: OK'

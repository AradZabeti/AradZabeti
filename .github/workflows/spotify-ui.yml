name: Load Spotify UI

on:
  push:
    paths:
      - 'spotify.js'
      - '.github/workflows/spotify-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inject Spotify script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="spotify.js" defer></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: load Spotify live UI'
          git push
